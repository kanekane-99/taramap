/* ---- SFONDO MAPPA ----------------------------------------------------------
   Per un uso stabile e continuativo incolla qui la chiave GRATUITA di MapTiler
   (cloud.maptiler.com, i dati sono di OpenStreetMap). Con la chiave la mappa funziona anche
   con doppio clic dal computer; sul sito online limita la chiave al dominio del sito.
   Senza chiave: sul sito online usa le tile standard di OpenStreetMap (uso leggero);
   aperto come file dal computer usa uno sfondo di riserva, perché OpenStreetMap
   blocca le richieste che non arrivano da un sito web. */
const MAPTILER_KEY='';
const online=location.protocol==='http:'||location.protocol==='https:';
const OSMC='<a href="https://www.openstreetmap.org/copyright">&copy; OpenStreetMap contributors</a>';
(MAPTILER_KEY
 ?L.tileLayer('https://api.maptiler.com/maps/streets-v4/256/{z}/{x}/{y}.png?key='+MAPTILER_KEY,{maxZoom:18,attribution:'<a href="https://www.maptiler.com/copyright/">&copy; MapTiler</a> '+OSMC})
 :online
 ?L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:OSMC})
 :L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles &copy; Esri'})
).addTo(map);
const layer=L.layerGroup().addTo(map);
const key=p=>p[0].toFixed(5)+','+p[1].toFixed(5);
const state={types:new Set(),q:''};
let groups=new Map(),lines=new Map(),vis=[],active=null;

const icon=n=>{const d=Math.max(14,Math.round(13*Math.sqrt(n)));
 return L.divIcon({className:'dot',iconSize:[d,d],iconAnchor:[d/2,d/2],popupAnchor:[0,-d/2],html:n>1?`<span style="font-size:${d<26?11:d<44?13:15}px">${n}</span>`:''})};

const PIN='<svg width="13" height="16" viewBox="0 0 24 24" fill="#6a5d11" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>';
function card(g){
 const d=g.items[g.cur];
 const ops=d.o.length>1?'<ul>'+d.o.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':(d.o.length?`<p>${esc(d.o[0])}</p>`:'');
 const zona=d.z?`<div class="blk"><span class="lab">Zona di operatività</span><p>${esc(d.z)}</p></div>`:'';
 const aiuti=ops?`<div class="blk"><span class="lab">Tipologia di aiuto</span>${ops}</div>`:'';
 const body=aiuti+zona;
 const nav=g.items.length>1?`<div class="nav"><button type="button" data-s="-1" aria-label="Soggetto precedente">‹</button><span>${g.cur+1} di ${g.items.length} da questo luogo</span><button type="button" data-s="1" aria-label="Soggetto successivo">›</button></div>`:'';
 return `<div class="card"><h3>${esc(d.n)}</h3>${d.t?`<span class="tag">${esc(d.t)}</span>`:''}${body?`<div class="body">${body}</div>`:''}${d.p?`<p class="loc">${PIN}<span>${esc(d.p)}</span></p>`:''}${nav}</div>`;
}

// scorre solo l'elenco (mai la pagina), così il menù chiuso resta chiuso
function revealRow(b){const l=document.getElementById('list'),t=b.offsetTop,h=b.offsetHeight;
 if(t<l.scrollTop)l.scrollTop=t;else if(t+h>l.scrollTop+l.clientHeight)l.scrollTop=t+h-l.clientHeight}
function highlight(d){
 lines.forEach(l=>l.setStyle({weight:1.2,opacity:.35}));
 groups.forEach(g=>{const e=g.marker.getElement();if(e)e.classList.remove('on')});
 document.querySelectorAll('#list [aria-current],#list [data-sel]').forEach(e=>{e.removeAttribute('aria-current');e.removeAttribute('data-sel')});
 active=d;if(!d)return;
 if(d.line){d.line.setStyle({weight:2.4,opacity:1});d.line.bringToFront()}
 const e=d.g.marker.getElement();if(e)e.classList.add('on');
 d.g.items.forEach(i=>{const b=document.querySelector(`#list button[data-id="${i.id}"]`);if(b)b.setAttribute('data-sel','')});
 const cur=document.querySelector(`#list button[data-id="${d.id}"]`);
 if(cur)cur.setAttribute('aria-current','true');
 const first=document.querySelector('#list [data-sel]');if(first)revealRow(first);
}

 groups=new Map();lines=new Map();
 vis=DATA.filter(d=>!state.types.size||d.tg.some(t=>state.types.has(t)));
 const arr=new Map();
 vis.forEach(d=>{
  if(!groups.has(key(d.a)))groups.set(key(d.a),{pos:d.a,items:[],cur:0});
  const g=groups.get(key(d.a));g.items.push(d);d.g=g;
  const ak=key(d.b),lk=key(d.a)+'>'+ak;
  if(!arr.has(ak))arr.set(ak,L.circleMarker(d.b,{radius:4,color:'#6a5d11',weight:2.5,fillColor:'#fff',fillOpacity:1,interactive:false}));
  if(key(d.a)!==ak&&!lines.has(lk))lines.set(lk,L.polyline([d.a,d.b],{color:'#6a5d11',weight:1.2,opacity:.35,dashArray:'6 6',interactive:false}));
  d.line=lines.get(lk);
 });
 lines.forEach(l=>layer.addLayer(l));arr.forEach(m=>layer.addLayer(m));
 groups.forEach(g=>{
  g.marker=L.marker(g.pos,{icon:icon(g.items.length),zIndexOffset:-g.items.length*100,keyboard:true,title:g.items.map(i=>i.n).slice(0,3).join(', ')});
  g.marker.bindPopup(()=>card(g),{maxWidth:340,autoPanPadding:[30,30]});
  g.marker.on('click',()=>highlight(g.items[g.cur]));
  g.marker.on('popupopen',e=>{
   const pop=e.popup;
   pop.getElement().onclick=ev=>{
    const b=ev.target.closest('.nav button');if(!b)return;
    ev.stopPropagation();
    g.cur=(g.cur+Number(b.dataset.s)+g.items.length)%g.items.length;
    pop.setContent(card(g));highlight(g.items[g.cur]);
   };
  });
  g.marker.on('popupclose',()=>{if(active&&active.g===g)highlight(null)});
  layer.addLayer(g.marker);
 });
 renderList();
}

const list=document.getElementById('list');
function renderList(){
 const q=state.q.trim().toLowerCase();
 const rows=vis.filter(d=>!q||(d.n+' '+d.p).toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n,'it'));
 document.getElementById('count').textContent=rows.length+(rows.length===1?' soggetto':' soggetti');
 list.innerHTML='';
 if(!rows.length){list.innerHTML='<li class="empty">Nessun risultato.</li>';return}
 rows.forEach(d=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.type='button';b.dataset.id=d.id;
  if(active&&active.g.items.includes(d))b.setAttribute('data-sel','');
  if(active&&active.id===d.id)b.setAttribute('aria-current','true');
  b.innerHTML=`<b>${esc(d.n)}</b><small>${esc(d.p||NONE)}</small>`;
  b.onclick=()=>select(d);li.appendChild(b);list.appendChild(li);
 });
}

function select(d){
 d.g.cur=d.g.items.indexOf(d);
 map.closePopup();
 map.fitBounds([d.a,d.b],{padding:[70,70],maxZoom:9,animate:true});
 highlight(d);
 setTimeout(()=>d.g.marker.openPopup(),350);
}

// pulsanti tipologia: uno solo alla volta; se nessuno è attivo vale "Tutti"
const fbox=document.getElementById('filters');
function drawFilters(){
 fbox.innerHTML='';
 const pick=t=>()=>{const was=state.types.has(t);state.types.clear();if(!was)state.types.add(t);drawFilters();render()};
 const items=[['Tutti',!state.types.size,()=>{state.types.clear();drawFilters();render()}],...TYPES.map(t=>[t,state.types.has(t),pick(t)])];
 items.forEach(([label,on,fn])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',on);b.onclick=fn;fbox.appendChild(b)});
}

// elenco a destra richiudibile
const side=document.getElementById('side'),handle=document.getElementById('handle');
function setSide(open){
 side.classList.toggle('closed',!open);
 handle.setAttribute('aria-expanded',open);
 handle.setAttribute('aria-label',open?'Chiudi elenco':'Apri elenco');
}
handle.onclick=()=>setSide(side.classList.contains('closed'));
side.addEventListener('transitionend',e=>{if(e.target===side)map.invalidateSize()});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;renderList()});
document.querySelector('main').addEventListener('scroll',e=>{e.target.scrollLeft=0;e.target.scrollTop=0});
if(mobile())setSide(false);
drawFilters();render();
</script>
</body>
</html>
